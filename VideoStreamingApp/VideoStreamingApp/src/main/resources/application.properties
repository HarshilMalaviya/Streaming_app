spring.application.name=VideoStreamingApp

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/video_streaming}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=${APP_PORT:3030}

files.video=${VIDEO_DIR:videos/}
files.video.hls=${VIDEO_HLS_DIR:videos_hls/}

spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174/**}
